<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FinanzApp — Vermögen &amp; Haushalt</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <!-- Barlow und Barlow Condensed werden von industry.css nachgeladen. Im Produktivbetrieb
         selbst hosten, siehe „Offene Punkte“ in der README. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="css/industry.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#f2f2f3" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <span class="boot-kicker">FinanzApp</span>
            <span class="boot-title">Wird geladen</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span>Es ist ein Fehler aufgetreten.</span>
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">Schließen</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
